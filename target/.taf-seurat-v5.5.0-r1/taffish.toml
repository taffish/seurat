[package]
name = "seurat"
kind = "tool"
version = "5.5.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/seurat"

[meta]
domain = "bio"
categories = ["single-cell", "scRNA-seq", "R", "Seurat", "visualization"]
keywords = ["Seurat", "single-cell", "scRNA-seq", "R", "SeuratObject", "UMAP", "PCA", "clustering", "markers"]
description = "Seurat 5.5.0 R runtime for single-cell analysis with SeuratObject, normalization, variable features, PCA, clustering, UMAP, marker testing, and plotting support."

[command]
name = "taf-seurat"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/seurat:5.5.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64"

[upstream]
name = "Seurat"
type = "github"
repo = "satijalab/seurat"
homepage = "https://satijalab.org/seurat/"
repository = "https://github.com/satijalab/seurat"
release_url = "https://github.com/satijalab/seurat/releases/tag/v5.5.0"
downloads = "https://cran.r-project.org/package=Seurat; docker://satijalab/seurat:5.5.0"
version = "5.5.0"
license = "MIT + file LICENSE"
citation = "Hao et al. Dictionary learning for integrative, multimodal and scalable single-cell analysis. Nature Biotechnology (2023) [Seurat v5]."
doi = "10.1038/s41587-023-01767-y"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 600
exist = ["R", "Rscript", "seurat-runtime-info", "bash", "sh"]
test = ["Rscript -e 'stopifnot(as.character(getRversion()) == \"4.5.2\"); stopifnot(as.character(packageVersion(\"Seurat\")) == \"5.5.0\"); stopifnot(as.character(packageVersion(\"SeuratObject\")) == \"5.4.0\")' && seurat-runtime-info --version | grep -Fx 'seurat-runtime-info 5.5.0-r1' >/dev/null && seurat-runtime-info | grep -F \"$(printf 'Seurat\\t5.5.0')\" >/dev/null && seurat-runtime-info | grep -F \"$(printf 'hdf5r\\t')\" >/dev/null && seurat-runtime-info | grep -F \"$(printf 'BPCells\\t')\" >/dev/null", "Rscript -e 'pkgs <- c(\"Seurat\",\"SeuratObject\",\"Matrix\",\"ggplot2\",\"patchwork\",\"future\",\"sctransform\",\"uwot\",\"RANN\",\"RcppAnnoy\",\"RcppHNSW\",\"RSpectra\",\"hdf5r\",\"BPCells\",\"glmGamPoi\",\"MAST\",\"SingleCellExperiment\",\"harmony\",\"leidenbase\"); missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly=TRUE)]; if (length(missing)) stop(paste(\"missing\", paste(missing, collapse=\",\")))' && seurat-runtime-info | grep -F \"$(printf 'Signac\\tMISSING')\" >/dev/null && seurat-runtime-info | grep -F \"$(printf 'Azimuth\\tMISSING')\" >/dev/null && seurat-runtime-info | grep -F \"$(printf 'SeuratData\\tMISSING')\" >/dev/null", "tmp=/tmp/taf-seurat-workflow-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; Rscript /opt/seurat/share/testdata/seurat_smoke.R \"$tmp/out\" && test -s \"$tmp/out/seurat_smoke.rds\" && test -s \"$tmp/out/markers.tsv\" && test -s \"$tmp/out/clusters.tsv\" && test -s \"$tmp/out/plots/umap.png\" && test -s \"$tmp/out/plots/umap.pdf\" && test -s \"$tmp/out/plots/qc_violin.png\" && test -s \"$tmp/out/plots/qc_violin.pdf\" && grep -F 'Seurat' \"$tmp/out/versions.tsv\" >/dev/null && grep -F 'Gene' \"$tmp/out/markers.tsv\" >/dev/null && rm -rf \"$tmp\""]
